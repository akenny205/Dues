AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Writes to the dues-app dev and prod Supabase databases on a schedule so
  neither gets paused for inactivity. Deploy with `npm run keepalive:deploy`.

Parameters:
  # Names of the SSM SecureString parameters holding each database's
  # connection string. scripts/deploy-keepalive.js writes them before
  # deploying — CloudFormation can't create SecureStrings itself.
  DevDbUrlParam:
    Type: String
    Default: /dues-app/keepalive/dev-db-url
  ProdDbUrlParam:
    Type: String
    Default: /dues-app/keepalive/prod-db-url
  # Where the "a ping failed" email goes. AWS sends this address a
  # confirmation link when the stack is first deployed (or the address
  # changes) — nothing is delivered until that link is clicked.
  AlertEmail:
    Type: String

Resources:
  KeepAliveFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: dues-supabase-keepalive
      Description: Writes to the dues-app dev and prod Supabase databases to keep them from pausing.
      CodeUri: src/
      Handler: index.handler
      Runtime: nodejs22.x
      Architectures: [arm64]
      MemorySize: 128
      Timeout: 60
      Environment:
        Variables:
          DEV_DB_URL_PARAM: !Ref DevDbUrlParam
          PROD_DB_URL_PARAM: !Ref ProdDbUrlParam
      # Reading a SecureString encrypted with the default aws/ssm key needs
      # no KMS permission of its own — only ssm:GetParameter.
      Policies:
        - SSMParameterReadPolicy:
            ParameterName: dues-app/keepalive/*
      Events:
        Ping:
          Type: Schedule
          Properties:
            # Supabase pauses a free project that hasn't seen "sufficient
            # activity" over the past 7 days, and its docs put that as "a few
            # user requests to the database each day" — a single write every
            # 3 days wasn't enough: both projects were paused in Oct 2026 with
            # every run succeeding. So this pings several times a day.
            # (Set here rather than as a stack parameter: `sam deploy` keeps a
            # parameter's previous value on update, so changing its Default
            # silently does nothing.)
            Schedule: rate(6 hours)
            Description: Supabase keep-alive ping for dues-app (dev + prod)
      # A scheduled run is an async invocation: if the handler throws, Lambda
      # retries it twice (about 1 and then 2 minutes later) and only then
      # gives up — at which point the failed invocation, error message
      # included, is published to the alert topic. So a blip that clears
      # within a few minutes never sends an email; one that doesn't, does.
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        DestinationConfig:
          OnFailure:
            Type: SNS
            Destination: !Ref AlertTopic

  AlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: dues-supabase-keepalive-alerts
      DisplayName: Dues Supabase keep-alive
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  KeepAliveLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${KeepAliveFunction}
      RetentionInDays: 30

Outputs:
  FunctionName:
    Value: !Ref KeepAliveFunction
